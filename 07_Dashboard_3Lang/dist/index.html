<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dubai Automotive Intelligence | Amir Kargar</title><style>
:root{--navy:#061a2b;--blue:#0878d1;--cyan:#35c6e8;--ink:#102238;--muted:#65758a;--bg:#eef3f8;--card:#fff;--green:#16a477}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf1f7,#dce8f1);font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#061a2b,#092d49);color:white;padding:28px 20px}.brand{font-size:25px;font-weight:800;letter-spacing:3px}.owner{margin:28px 0 36px;color:#b9d9f2;line-height:1.7}.owner b{color:white}.nav button{display:block;width:100%;border:0;background:transparent;color:#dcecf7;text-align:left;padding:13px 14px;border-radius:10px;margin:5px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#0a70c7;color:white}.main{padding:34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow{color:#0673c8;font-weight:700;letter-spacing:2px;font-size:12px}.title{font-size:38px;margin:8px 0}.subtitle,.label{color:var(--muted)}.controls{display:flex;gap:10px}.select{padding:10px 14px;border:1px solid #d2dce7;border-radius:12px;background:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card{background:rgba(255,255,255,.92);border:1px solid #dbe4ed;border-radius:18px;padding:20px;box-shadow:0 8px 25px #12324a10}.value{font-size:32px;font-weight:800;margin-top:8px}.delta{font-size:13px;margin-top:8px;color:var(--green)}.wide{grid-column:span 2}.chart{height:250px;display:flex;align-items:end;gap:28px;padding:25px 20px 5px;border-bottom:1px solid #d6e0ea}.bar{flex:1;background:linear-gradient(180deg,var(--blue),#58bce2);border-radius:10px 10px 0 0;min-height:25px;position:relative}.bar span{position:absolute;bottom:-25px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}.insight{background:#eaf6ff;border-right:4px solid var(--blue);padding:16px;border-radius:10px;line-height:1.8}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e2e9f0;text-align:right}.pill{padding:5px 9px;border-radius:20px;background:#e4f5ee;color:#087a5b;font-size:12px}.footer{margin-top:28px;color:var(--muted);font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.main{padding:18px}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.top{display:block}.title{font-size:28px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">DUBAI AUTO</div><div class="owner">Decision Intelligence<br><b>Amir Kargar</b><br>Sales · After-Sales · EV</div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><div class="subtitle" id="subtitle"></div></div><div class="controls"><select class="select" id="lang"><option value="fa">فارسی</option><option value="en">English</option><option value="ar">العربية</option></select><select class="select"><option>2025</option><option>2024</option><option>2023</option></select></div></header><section id="content"></section><div class="footer" id="footer"></div></main></div><script>
const T={fa:{ey:'هوشمندی بازار خودرو دبی',title:'داشبورد هوشمندی خودرو',sub:'فروش، خدمات پس از فروش، خودروهای برقی و تحلیل رقبا',foot:'تهیه‌شده توسط Amir Kargar · داده‌های عمومی و نمونه‌ای با محدودیت‌های مشخص',nav:['نمای کلی','منابع و کیفیت داده','فروش و بازار','خدمات پس از فروش','آمادگی EV','خودروی کارکرده','هوشمندی ناوگان','صدای مشتری','تحلیل رقبا','اولویت فرصت‌ها','پیشنهادهای اجرایی','روش‌شناسی']},en:{ey:'DUBAI AUTOMOTIVE INTELLIGENCE',title:'Automotive Intelligence Dashboard',sub:'Sales, after-sales, EV readiness and competitive intelligence',foot:'Prepared by Amir Kargar · Public and synthetic data with documented limitations',nav:['Executive Overview','Sources & Data Quality','Sales & Market','After-Sales','EV Readiness','Used Cars','Fleet Intelligence','Customer Voice','Competitor Benchmark','Opportunity Priorities','Recommendations','Methodology']},ar:{ey:'ذكاء سوق السيارات في دبي',title:'لوحة ذكاء السيارات',sub:'المبيعات، خدمات ما بعد البيع، جاهزية المركبات الكهربائية والمنافسة',foot:'إعداد أمير کارگر · بيانات عامة واصطناعية مع توضيح القيود',nav:['نظرة تنفيذية','المصادر وجودة البيانات','المبيعات والسوق','خدمات ما بعد البيع','جاهزية المركبات الكهربائية','السيارات المستعملة','ذكاء الأساطيل','صوت العميل','مقارنة المنافسين','أولويات الفرص','التوصيات','المنهجية']}};let lang='fa',active=0;const data=[['2.46M','+0.5%','کل تحویل خودرو'],['15.5%','+2.5 pp','سهم BEV'],['82','/100','امتیاز آمادگی دیجیتال'],['12','فرصت','فرصت‌های اولویت‌دار']];
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir||'rtl';document.getElementById('eyebrow').textContent=t.ey;document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.sub;document.getElementById('footer').textContent=t.foot;document.getElementById('nav').innerHTML=t.nav.map((x,i)=>`<button class="${i===active?'active':''}" onclick="active=${i};render()">${i+1}. ${x}</button>`).join('');document.getElementById('content').innerHTML=active===0?overview(t):detail(t)}
function overview(t){return `<div class="grid">${data.map(x=>`<div class="card"><div class="label">${x[2]}</div><div class="value">${x[0]}</div><div class="delta">${x[1]}</div></div>`).join('')}</div><div class="grid"><div class="card wide"><div class="label">${lang==='en'?'Regional deliveries':lang==='ar'?'التسليمات حسب المنطقة':'تحویل منطقه‌ای'}</div><div class="chart"><div class="bar" style="height:85%"><span>Europe</span></div><div class="bar" style="height:42%"><span>Americas</span></div><div class="bar" style="height:74%"><span>Asia</span></div><div class="bar" style="height:14%;background:#9aaabd"><span>Other</span></div></div></div><div class="card"><div class="label">${lang==='en'?'Executive signal':lang==='ar'?'الإشارة التنفيذية':'سیگنال مدیریتی'}</div><h2>${lang==='en'?'Integrate customer journeys':lang==='ar'?'دمج رحلات العملاء':'یکپارچه‌سازی سفر مشتری'}</h2><p class="insight">${lang==='en'?'Connect sales, service, EV, used cars and fleet data into one measurable customer intelligence layer.':lang==='ar'?'ربط بيانات المبيعات والخدمة والمركبات الكهربائية والسيارات المستعملة والأساطيل في طبقة واحدة قابلة للقياس.':'اتصال داده‌های فروش، خدمات، خودروهای برقی، خودروهای کارکرده و ناوگان در یک لایه قابل‌اندازه‌گیری.'}</p></div></div>`}
function detail(t){return `<div class="grid"><div class="card wide"><div class="label">${t.nav[active]}</div><h2>${lang==='en'?'Evidence-based view with KPI definitions, source traceability and action-oriented insights':lang==='ar'?'عرض قائم على الأدلة مع مؤشرات ومصادر وتوصيات تنفيذية':'نمای مبتنی بر شواهد با KPI، ردیابی منابع و پیشنهاد اجرایی'}</h2><div class="chart"><div class="bar" style="height:68%"><span>KPI 1</span></div><div class="bar" style="height:84%"><span>KPI 2</span></div><div class="bar" style="height:52%"><span>KPI 3</span></div><div class="bar" style="height:75%"><span>KPI 4</span></div></div></div><div class="card"><div class="label">${lang==='en'?'Recommended action':lang==='ar'?'الإجراء المقترح':'اقدام پیشنهادی'}</div><h2>${lang==='en'?'Validate with internal data':lang==='ar'?'التحقق باستخدام البيانات الداخلية':'اعتبارسنجی با داده داخلی'}</h2><p class="insight">${lang==='en'?'Confirm the finding with CRM, DMS, service and finance data before executive action.':lang==='ar'?'تأكيد النتيجة باستخدام بيانات CRM وDMS والخدمة والمالية قبل اتخاذ القرار.':'قبل از تصمیم مدیریتی، یافته را با داده‌های CRM، DMS، خدمات و مالی تأیید کنید.'}</p></div></div><div class="card"><table class="table"><tr><th>KPI</th><th>Value</th><th>Status</th></tr><tr><td>Data coverage</td><td>87%</td><td><span class="pill">Ready</span></td></tr><tr><td>Source traceability</td><td>100%</td><td><span class="pill">Verified</span></td></tr><tr><td>Confidence</td><td>Medium</td><td><span class="pill">Validate</span></td></tr></table></div>`}document.getElementById('lang').onchange=e=>{lang=e.target.value;render()};render();
</script></body></html>
